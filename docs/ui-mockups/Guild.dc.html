<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>길드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#E2B657;text-decoration:none}a:hover{color:#F0CB7A}
*{box-sizing:border-box}
.lbl{font-size:12px;color:#A29E95}
.tab{display:flex;align-items:center;justify-content:center;min-height:44px;border:none;border-bottom:2px solid transparent;background:transparent;color:#A29E95;font:inherit;font-size:14px}
.tab.on{color:#E2B657;border-bottom-color:#D9A441;font-weight:600}
.q{display:flex;flex-direction:column;gap:6px;border-radius:12px;border:1px solid #2F333E;background:#1B1E26;padding:12px 14px}
.g{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid #4A5060;color:#C9C3B7}
.take{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #D9A441;background:transparent;color:#E2B657;font:inherit;font-size:14px;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #14161C; color: #ECE7DD; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #2A2E38; background: #181B22">
    <a href="Town.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 6px; font-size: 14px">‹ 마을</a>
    <span style="font-size: 16px; font-weight: 600">길드</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding-right: 6px">1,240 G</span>
  </div>

  <div style="position: relative; height: 290px; flex-shrink: 0">
    <div style="height: 290px; border-bottom: 1px dashed #4A5060; background: #1A1D24; display: flex; align-items: center; justify-content: center; color: #8F8C85; font-size: 13px">[일러스트: 길드 접수원]</div>
    <div style="position: absolute; left: 12px; right: 12px; bottom: -28px; border-radius: 12px; border: 1px solid #3A3F4B; background: #20232C; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #E2B657; font-weight: 600">접수원</span>
      <span style="font-size: 14px; line-height: 1.5">무사히 돌아오셨네요. 오늘은 어떤 일로 오셨나요?</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 40px; border-bottom: 1px solid #2A2E38; padding: 0 12px">
    <button class="tab on">퀘스트</button>
    <button class="tab">등급</button>
    <button class="tab">창고</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 16px; flex-grow: 1; overflow: hidden">
    <div style="display: flex; justify-content: space-between"><span class="lbl">수주 중 1/3 · 내 등급 D</span><span class="lbl">수주 가능: E ~ C</span></div>

    <div class="q">
      <div style="display: flex; align-items: center; gap: 8px"><span class="g" style="border-color: #D9A441; color: #E2B657">C</span><span style="font-size: 15px; font-weight: 600">거대 거미 독샘 채집</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span class="lbl">목표 7층 · 보상 ×1.5 · 480G · 경험치 650</span>
        <button class="take">수주</button>
      </div>
    </div>

    <div class="q" style="border-color: #3A4A5E">
      <div style="display: flex; align-items: center; gap: 8px"><span class="g">D</span><span style="font-size: 15px; font-weight: 600">고블린 정찰대 토벌</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span class="lbl">목표 6층 · 진행 3/5 처치 · 320G</span>
        <span style="font-size: 13px; color: #7FA8D8">수주 중</span>
      </div>
    </div>

    <div class="q">
      <div style="display: flex; align-items: center; gap: 8px"><span class="g">E</span><span style="font-size: 15px; font-weight: 600">슬라임 점액 수집</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span class="lbl">목표 3층 · 보상 ×0.5 · 90G · 경험치 120</span>
        <button class="take">수주</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
