# 웹 이식판 빌드 (v2.5~): Unity 없이 web/ 만으로 테스트 → 웹 zip + 안드로이드 APK(Capacitor).
# - web/ 아래가 바뀌어 main에 올라오면 자동 실행, Actions 탭 Run workflow로도 실행.
# - 결과는 Releases: "web-latest"(압축을 풀고 정적 서버로 열기), "android-latest"(APK). Unity판 워크플로는 보관용(수동 실행, unity-* 태그).
# - Unity 라이선스 비밀값이 필요 없다. APK는 디버그 키 서명 (고정 키는 선택: ANDROID_KEYSTORE_* 비밀값이 생기면 추가).
name: 웹 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/export/**"
      - ".github/workflows/web-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-app
  cancel-in-progress: true

jobs:
  build:
    name: 테스트 · 웹 · APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 설치
        run: npm ci

      - name: 타입 검사 · 테스트 · 웹 빌드
        run: npm run check

      - name: 웹 zip
        run: |
          (cd dist && zip -qr "$GITHUB_WORKSPACE/adventurer-web.zip" .)
          ls -la "$GITHUB_WORKSPACE/adventurer-web.zip"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 프로젝트에 웹 빌드 넣기
        run: npx cap sync android

      - name: APK 빌드 (고정 키가 있으면 그 키로 서명)
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/adventurer.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/adventurer.jks"
            echo "고정 키로 서명합니다"
          else
            echo "::warning::서명 키 비밀값이 없어 임시 디버그 키로 서명합니다 (업데이트 설치 불가)"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionName=2.7.${{ github.run_number }} -PappVersionCode=${{ github.run_number }}0
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/adventurer-next.apk"
          ls -la "$GITHUB_WORKSPACE/adventurer-next.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: adventurer-next-${{ github.run_number }}
          path: |
            adventurer-web.zip
            adventurer-next.apk
          retention-days: 14

      - name: 릴리스 갱신
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete web-latest --yes --cleanup-tag || true
          gh release create web-latest adventurer-web.zip --prerelease --target "${{ github.sha }}" \
            --title "최신 웹 빌드 #${{ github.run_number }}" \
            --notes "압축을 풀고 폴더에서 'python3 -m http.server' 후 localhost:8000"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest adventurer-next.apk --prerelease --target "${{ github.sha }}" \
            --title "최신 APK #${{ github.run_number }}" \
            --notes "Capacitor로 감싼 안드로이드 앱 (테스트용, 디버그 서명)"

  # 빌드마다 깃허브 정리 (CLAUDE.md 8번). 세션의 깃허브 연결은 삭제·태그를 막아 여기서 한다.
  cleanup:
    name: 깃허브 정리
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 브랜치·릴리스·태그 정리
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          # Unity 기준 태그는 늘 남긴다
          # 기본 토큰은 워크플로 파일이 다른 커밋에 태그를 못 붙일 수 있어(403) 실패해도 경고만 남긴다
          tag() { git rev-parse -q --verify "refs/tags/$1" >/dev/null || gh api -X POST repos/$REPO/git/refs -f ref="refs/tags/$1" -f sha="$2" >/dev/null || { echo "::warning::태그 $1 만들기 실패"; return 1; }; }
          tag unity-v2.4 141ef7ff34ed29f0f17eae85d9b4050915a0efa2 || true
          week=$(date -d '7 days ago' +%s)
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            if [ "$b" = main ] || [ "$b" = HEAD ]; then continue; fi
            if git merge-base --is-ancestor "origin/$b" origin/main; then
              echo "합친 브랜치 삭제: $b"
            elif [ "$(git log -1 --format=%ct "origin/$b")" -lt "$week" ]; then
              # 안 합친 브랜치는 7일 넘게 멈춰 있을 때만 archive/<이름> 태그로 보관하고 지운다
              echo "안 합친 브랜치 보관 후 삭제: archive/$b"
              tag "archive/$b" "$(git rev-parse "origin/$b")" || continue
            else
              echo "::notice::안 합친 최근 브랜치는 남김: $b"; continue
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
          done
          # 빌드가 더는 만들지 않는 예전 릴리스(+태그) 삭제
          for r in $(gh api "repos/$REPO/releases" --paginate -q '.[].tag_name'); do
            case "$r" in web-latest|android-latest|unity-web|unity-android) ;; *) echo "예전 릴리스 삭제: $r"; gh release delete "$r" -R "$REPO" --yes --cleanup-tag ;; esac
          done
